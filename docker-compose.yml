services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       shgps
      POSTGRES_USER:     shgps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shgps
    deploy:
      resources:
        limits:
          memory: 256M

  traccar:
    image: traccar/traccar:ubuntu
    ports:
      - "5055:5055"
      - "5023:5023"
      - "5027:5027"
      - "5001:5001"
    volumes:
      - traccar_data:/opt/traccar/data
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    restart: unless-stopped
    networks:
      - shgps
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: ./backend
    environment:
      PORT:                   3001
      DATABASE_URL:           postgresql://shgps:${DB_PASSWORD}@postgres:5432/shgps
      JWT_SECRET:             ${JWT_SECRET}
      TRACCAR_URL:            http://traccar:8082
      TRACCAR_ADMIN_EMAIL:    ${TRACCAR_ADMIN_EMAIL}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD}
      FRONTEND_URL:           http://${DOMAIN}
      NODE_ENV:               production
    depends_on:
      - postgres
      - traccar
    restart: unless-stopped
    networks:
      - shgps
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shgps
    deploy:
      resources:
        limits:
          memory: 64M

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --email admin@shgps.ma --agree-tos --force-renewal --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - shgps

volumes:
  postgres_data:
  traccar_data:
  letsencrypt:
  certbot_www:

networks:
  shgps:
    driver: bridge
