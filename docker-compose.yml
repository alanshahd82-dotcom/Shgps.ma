services:

  postgres:
    image: postgres:16-alpine
    container_name: shgps-postgres-1
    environment:
      POSTGRES_DB:       shgps
      POSTGRES_USER:     shgps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shgps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shgps -d shgps"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  traccar:
    image: traccar/traccar:ubuntu
    container_name: shgps-traccar-1
    # Custom entrypoint: removes stale H2 lock file before startup to prevent
    # "database.mv.db is locked" errors after unclean container shutdowns.
    entrypoint: ["/bin/bash", "/opt/traccar/entrypoint.sh"]
    ports:
      - "5023:5023"   # GT06 / WanWay GS900E
      - "5029:5029"   # WanWay protocol
      - "5055:5055"   # Traccar Client app
      - "5027:5027"   # Teltonika
      - "5001:5001"   # Generic
    volumes:
      - traccar_data:/opt/traccar/data
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - ./traccar/entrypoint.sh:/opt/traccar/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Give Traccar up to 30 s to flush the H2 MVStore on SIGTERM before Docker
    # sends SIGKILL; this prevents lock files from being left behind.
    stop_grace_period: 30s
    networks:
      - shgps
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8082"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 384M

  backend:
    build: ./backend
    container_name: shgps-backend-1
    environment:
      PORT:                   3001
      DATABASE_URL:           postgresql://shgps:${DB_PASSWORD}@postgres:5432/shgps
      JWT_SECRET:             ${JWT_SECRET}
      TRACCAR_URL:            http://traccar:8082
      TRACCAR_ADMIN_EMAIL:    ${TRACCAR_ADMIN_EMAIL}
      TRACCAR_ADMIN_PASSWORD: ${TRACCAR_ADMIN_PASSWORD}
      GEOAPIFY_API_KEY:       ${GEOAPIFY_API_KEY}
      MAPBOX_TOKEN:           ${MAPBOX_TOKEN}
      GEOAPIFY_MAP_STYLE:     ${GEOAPIFY_MAP_STYLE:-osm-bright}
      FRONTEND_URL:           ${FRONTEND_URL}
      NODE_ENV:               production
    depends_on:
      postgres:
        condition: service_healthy
      traccar:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shgps
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: shgps-nginx-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shgps
    deploy:
      resources:
        limits:
          memory: 64M

  certbot:
    image: certbot/certbot
    container_name: shgps-certbot-1
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - shgps

  # ── Daily automated database backup ──────────────────────────────────────
  db-backup:
    image: postgres:16-alpine
    container_name: shgps-backup-1
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - backups_data:/backups
    entrypoint: >
      /bin/sh -c '
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          echo "[backup] Running pg_dump at $$TIMESTAMP";
          pg_dump -h postgres -U shgps -d shgps | gzip > /backups/shgps_$$TIMESTAMP.sql.gz;
          echo "[backup] Done. Pruning old backups (keep last 7)";
          ls -t /backups/*.sql.gz | tail -n +8 | xargs -r rm -f;
          echo "[backup] Sleeping 24h";
          sleep 86400;
        done
      '
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - shgps
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  traccar_data:
  letsencrypt:
  certbot_www:
  backups_data:

networks:
  shgps:
    driver: bridge
