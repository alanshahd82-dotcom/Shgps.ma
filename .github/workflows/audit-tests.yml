name: Audit Tests + Live Telemetry
on:
  workflow_dispatch:
  push:
    branches: [ audit/run-tests ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Run full backend test suite
        working-directory: backend
        run: node --test test/*.test.js
      - name: Frontend build
        run: |
          npm install --no-audit --no-fund
          npm run build

  live-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Capture live production telemetry
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            cd /opt/shgps
            git fetch origin audit/run-tests 2>/dev/null || true
            git show origin/audit/run-tests:backend/scripts/capture-telemetry.mjs > /tmp/capture.mjs
            docker cp /tmp/capture.mjs shgps-backend-1:/app/capture.mjs
            docker exec shgps-backend-1 node /app/capture.mjs
