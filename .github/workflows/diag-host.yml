name: Reboot Verification

on:
  workflow_dispatch:

jobs:
  reboot-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-reboot verification and trigger reboot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            echo "=== PRE-REBOOT START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            echo ""
            echo "=== 1. Pre-reboot: Verify port 5023 (tcpdump 20s) ==="
            echo "CAPTURE_START $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            timeout 20 tcpdump -i eth0 -n -nn port 5023 -c 10 2>&1 || echo "tcpdump done"
            echo "CAPTURE_END $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            echo ""
            echo "=== 2. Pre-reboot: Verify device 37 online ==="
            TRACCAR_EMAIL=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_EMAIL 2>/dev/null)
            TRACCAR_PASS=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_PASSWORD 2>/dev/null)
            TRACCAR_IP=$(docker inspect shgps-traccar-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/devices" 2>&1 | python3 -m json.tool 2>/dev/null || echo "API call failed"

            echo ""
            echo "=== 3. Pre-reboot: DOCKER-BRIDGE ==="
            iptables -L DOCKER-BRIDGE -n -v 2>&1 | head -10

            echo ""
            echo "=== 4. Triggering VPS reboot ==="
            nohup sh -c 'sleep 3 && shutdown -r now' >/dev/null 2>&1 &
            echo "Reboot scheduled in 3 seconds"

            echo ""
            echo "=== PRE-REBOOT END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
        continue-on-error: true

      - name: Wait for VPS to come back up
        run: sleep 180

      - name: Post-reboot verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            echo "=== POST-REBOOT START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            echo ""
            echo "=== 1. Post-reboot: Uptime ==="
            uptime 2>&1

            echo ""
            echo "=== 2. Post-reboot: Docker status ==="
            systemctl is-active docker 2>&1
            docker ps --format '{{.Names}} {{.Status}}' 2>&1

            echo ""
            echo "=== 3. Post-reboot: Wait for Traccar healthy ==="
            for i in $(seq 1 30); do
              HEALTH=$(docker inspect shgps-traccar-1 --format '{{.State.Health.Status}}' 2>/dev/null)
              if [ "$HEALTH" = "healthy" ]; then
                echo "Traccar healthy (attempt $i)"
                break
              fi
              echo "Waiting for Traccar health... (attempt $i, status: $HEALTH)"
              sleep 5
            done

            echo ""
            echo "=== 4. Post-reboot: DOCKER-BRIDGE ==="
            iptables -L DOCKER-BRIDGE -n -v 2>&1

            echo ""
            echo "=== 5. Post-reboot: DOCKER-CT ==="
            iptables -L DOCKER-CT -n -v 2>&1

            echo ""
            echo "=== 6. Post-reboot: DOCKER chain ==="
            iptables -L DOCKER -n -v 2>&1

            echo ""
            echo "=== 7. Post-reboot: FORWARD chain ==="
            iptables -L FORWARD -n -v 2>&1 | head -10

            echo ""
            echo "=== 8. Post-reboot: Rule check ==="
            BRIDGE_OK=$(iptables -L DOCKER-BRIDGE -n -v 2>/dev/null | grep -c "br-e735dbe613a3")
            CT_OK=$(iptables -L DOCKER-CT -n -v 2>/dev/null | grep -c "br-e735dbe613a3")
            DOCKER_OK=$(iptables -L DOCKER -n -v 2>/dev/null | grep -c "5023")
            echo "DOCKER-BRIDGE has br-e735dbe613a3: $BRIDGE_OK"
            echo "DOCKER-CT has br-e735dbe613a3: $CT_OK"
            echo "DOCKER chain has 5023: $DOCKER_OK"

            echo ""
            echo "=== 9. Post-reboot: Verify port 5023 (tcpdump 30s) ==="
            echo "CAPTURE_START $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            timeout 30 tcpdump -i eth0 -n -nn port 5023 -c 20 2>&1 || echo "tcpdump done"
            echo "CAPTURE_END $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            echo ""
            echo "=== 10. Post-reboot: Verify device 37 online ==="
            TRACCAR_EMAIL=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_EMAIL 2>/dev/null)
            TRACCAR_PASS=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_PASSWORD 2>/dev/null)
            TRACCAR_IP=$(docker inspect shgps-traccar-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/devices" 2>&1 | python3 -m json.tool 2>/dev/null || echo "API call failed"

            echo ""
            echo "=== 11. Post-reboot: Verify H2 database ==="
            docker exec shgps-traccar-1 stat /opt/traccar/data/database.mv.db 2>&1 | grep -i modify

            echo ""
            echo "=== POST-REBOOT END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
