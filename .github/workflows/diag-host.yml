name: Host Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Verify device online status via Traccar API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            echo "=== VERIFY START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            echo ""
            echo "=== 1. FORWARD chain counters (confirm 5023 traffic flowing) ==="
            iptables -L FORWARD -n -v 2>&1 | head -5

            echo ""
            echo "=== 2. Traccar API: devices (via curl + basic auth) ==="
            TRACCAR_EMAIL=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_EMAIL 2>/dev/null)
            TRACCAR_PASS=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_PASSWORD 2>/dev/null)
            TRACCAR_IP=$(docker inspect shgps-traccar-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            echo "Traccar IP: $TRACCAR_IP"
            echo "--- Devices ---"
            curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/devices" 2>&1 | python3 -m json.tool 2>/dev/null || curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/devices" 2>&1

            echo ""
            echo "=== 3. Traccar API: positions (current) ==="
            curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/positions" 2>&1 | python3 -m json.tool 2>/dev/null || curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/positions" 2>&1

            echo ""
            echo "=== 4. Traccar log file: new entries since fix (grep 2026-09-02) ==="
            docker exec shgps-traccar-1 grep "2026-09-02" /opt/traccar/logs/tracker-server.log 2>&1 | tail -30 || echo "no 2026-09-02 entries in log file"

            echo ""
            echo "=== 5. H2 database modification time (confirm data being written) ==="
            docker exec shgps-traccar-1 stat /opt/traccar/data/database.mv.db 2>&1 | grep -i modify

            echo ""
            echo "=== 6. Traccar container connections on port 5023 ==="
            docker exec shgps-traccar-1 cat /proc/net/tcp6 2>/dev/null | grep 1397 | head -20

            echo ""
            echo "=== 7. Quick eth0 tcpdump 15s (confirm ongoing traffic) ==="
            echo "CAPTURE_START $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            timeout 15 tcpdump -i eth0 -n -nn port 5023 -c 30 2>&1 || echo "tcpdump done"
            echo "CAPTURE_END $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            echo ""
            echo "=== VERIFY END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
