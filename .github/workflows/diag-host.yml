name: Host Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Network binding + bridge diagnostic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            echo "=== DIAG2 START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            echo ""
            echo "=== 1. Container IP addresses ==="
            echo "--- Traccar ---"
            docker inspect shgps-traccar-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>&1
            echo "--- All containers on shgps network ---"
            docker network inspect shgps --format '{{range .Containers}}{{.Name}}={{.IPv4Address}} {{end}}' 2>&1

            echo ""
            echo "=== 2. Traccar listen sockets (/proc/net/tcp) ==="
            echo "--- Port 5023 (0x1397) and 8082 (0x1F92) ---"
            docker exec shgps-traccar-1 bash -c "cat /proc/net/tcp | grep -E '1397|1F92|1f92'" 2>&1
            echo "--- IPv6 ---"
            docker exec shgps-traccar-1 bash -c "cat /proc/net/tcp6 2>/dev/null | grep -E '1397|1F92|1f92'" 2>&1
            echo ""
            echo "Format: local_address:port remote_address:port state"
            echo "0.0.0.0=00000000  127.0.0.1=01000000  state 0A=LISTEN"

            echo ""
            echo "=== 3. Host -> container connectivity on 5023 ==="
            TRACCAR_IP=$(docker inspect shgps-traccar-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            echo "Traccar IP: $TRACCAR_IP"
            bash -c "echo > /dev/tcp/$TRACCAR_IP/5023 && echo 'HOST->CONTAINER 5023 REACHABLE' || echo 'HOST->CONTAINER 5023 UNREACHABLE'" 2>&1
            bash -c "echo > /dev/tcp/$TRACCAR_IP/8082 && echo 'HOST->CONTAINER 8082 REACHABLE' || echo 'HOST->CONTAINER 8082 UNREACHABLE'" 2>&1

            echo ""
            echo "=== 4. Docker bridge tcpdump (15s) ==="
            echo "BRIDGE_CAPTURE_START $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            timeout 15 tcpdump -i br-e735dbe613a3 -n -nn port 5023 -c 30 2>&1 || echo "bridge tcpdump done"
            echo "BRIDGE_CAPTURE_END $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            echo ""
            echo "=== 5. Host eth0 tcpdump with both directions (15s) ==="
            echo "ETH_CAPTURE_START $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            timeout 15 tcpdump -i eth0 -n -nn port 5023 -c 30 2>&1 || echo "eth0 tcpdump done"
            echo "ETH_CAPTURE_END $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            echo ""
            echo "=== 6. Traccar web API from backend ==="
            docker exec shgps-backend-1 bash -c "wget -qO- --timeout=5 http://traccar:8082/api/server 2>&1 | head -5 || echo 'BACKEND CANNOT REACH TRACCAR API'" 2>&1

            echo ""
            echo "=== 7. Traccar web API from host (via container IP) ==="
            bash -c "wget -qO- --timeout=5 http://$TRACCAR_IP:8082/api/server 2>&1 | head -5 || echo 'HOST CANNOT REACH TRACCAR API'" 2>&1

            echo ""
            echo "=== 8. conntrack for port 5023 ==="
            conntrack -L 2>/dev/null | grep 5023 | head -20 || echo "conntrack not available or no entries"

            echo ""
            echo "=== 9. iptables FORWARD chain ==="
            iptables -L FORWARD -n -v 2>/dev/null | head -30 || echo "iptables not found"

            echo ""
            echo "=== 10. Docker network inspect (full) ==="
            docker network inspect shgps 2>&1 | head -80

            echo ""
            echo "=== DIAG2 END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
