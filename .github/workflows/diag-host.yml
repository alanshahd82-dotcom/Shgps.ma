name: Live Telemetry Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full Traccar API data for devices 37 and 70
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "=== AUDIT START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            TRACCAR_EMAIL=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_EMAIL 2>/dev/null)
            TRACCAR_PASS=$(docker exec shgps-backend-1 printenv TRACCAR_ADMIN_PASSWORD 2>/dev/null)
            TRACCAR_IP=$(docker inspect shgps-traccar-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)

            echo ""
            echo "=== 1. Traccar /api/devices (id 37 and 70) ==="
            curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/devices" 2>&1 | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            for d in data:
                if d.get('id') in [37, 70]:
                    print(json.dumps(d, indent=2))
            " 2>&1

            echo ""
            echo "=== 2. Traccar /api/positions (deviceId 37 and 70) ==="
            curl -s --max-time 10 -u "$TRACCAR_EMAIL:$TRACCAR_PASS" "http://$TRACCAR_IP:8082/api/positions" 2>&1 | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            for p in data:
                if p.get('deviceId') in [37, 70]:
                    print(json.dumps(p, indent=2))
            " 2>&1

            echo ""
            echo "=== 3. Backend /api/devices (via localhost) ==="
            BACKEND_IP=$(docker inspect shgps-backend-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
            # Try to get a JWT token by logging in
            LOGIN_RES=$(curl -s --max-time 10 -X POST "http://localhost:3000/api/auth/login" -H "Content-Type: application/json" -d "{\"email\": \"$TRACCAR_EMAIL\", \"password\": \"$TRACCAR_PASS\"}" 2>&1)
            TOKEN=$(echo "$LOGIN_RES" | python3 -c "import sys, json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
            if [ -n "$TOKEN" ]; then
              curl -s --max-time 10 "http://localhost:3000/api/devices" -H "Authorization: Bearer $TOKEN" 2>&1 | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              for d in data:
                  if d.get('traccarId') in [37, 70] or d.get('id') in [14, 16]:
                      print(json.dumps(d, indent=2))
              " 2>&1
            else
              echo "Login failed, showing raw response:"
              echo "$LOGIN_RES"
            fi

            echo ""
            echo "=== 4. Backend /api/map/positions (via localhost) ==="
            if [ -n "$TOKEN" ]; then
              curl -s --max-time 10 "http://localhost:3000/api/map/positions" -H "Authorization: Bearer $TOKEN" 2>&1 | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              for d in data:
                  if d.get('id') in [14, 16]:
                      print(json.dumps(d, indent=2))
              " 2>&1
            else
              echo "No token available"
            fi

            echo ""
            echo "=== AUDIT END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
