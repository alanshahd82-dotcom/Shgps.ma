name: Host Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run H2/memory/thread diagnostics via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            echo "=== DIAG START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            echo ""
            echo "=== 1. Docker container resource usage ==="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>&1

            echo ""
            echo "=== 2. Traccar container state ==="
            docker inspect shgps-traccar-1 --format "Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}}" 2>&1
            echo ""
            docker inspect shgps-traccar-1 --format "MemoryLimit={{.HostConfig.Memory}} CPUQuota={{.HostConfig.CpuQuota}}" 2>&1

            echo ""
            echo "=== 3. H2 database files ==="
            docker exec shgps-traccar-1 ls -la /opt/traccar/data/ 2>&1
            echo ""
            docker exec shgps-traccar-1 du -sh /opt/traccar/data/ 2>&1
            echo ""
            echo "--- H2 lock file check ---"
            docker exec shgps-traccar-1 bash -c "ls -la /opt/traccar/data/*.lock.db 2>&1 || echo 'NO LOCK FILE'" 2>&1

            echo ""
            echo "=== 4. Traccar port binding check ==="
            docker exec shgps-traccar-1 bash -c "echo > /dev/tcp/localhost/8082 && echo 'WEB 8082 OPEN' || echo 'WEB 8082 CLOSED'" 2>&1
            docker exec shgps-traccar-1 bash -c "echo > /dev/tcp/localhost/5023 && echo 'GT06 5023 OPEN' || echo 'GT06 5023 CLOSED'" 2>&1
            echo ""
            echo "--- ss inside container ---"
            docker exec shgps-traccar-1 bash -c "ss -lntp 2>/dev/null || netstat -tlnp 2>/dev/null || echo 'no ss/netstat'" 2>&1

            echo ""
            echo "=== 5. Java process status ==="
            docker exec shgps-traccar-1 bash -c "ps aux 2>/dev/null | head -20" 2>&1
            echo ""
            echo "--- JVM memory (from /proc) ---"
            docker exec shgps-traccar-1 bash -c "PID=\$(pgrep -f tracker-server || echo 1); cat /proc/\$PID/status 2>/dev/null | grep -E 'VmRSS|VmSize|Threads|VmPeak'" 2>&1

            echo ""
            echo "=== 6. JVM thread dump (top 300 lines) ==="
            docker exec shgps-traccar-1 bash -c "PID=\$(pgrep -f tracker-server); jstack \$PID 2>&1 | head -300 || (kill -3 \$PID 2>&1; sleep 2; echo 'SIGQUIT sent - check docker logs')" 2>&1

            echo ""
            echo "=== 7. Traccar container logs (last 10 min, 300 lines) ==="
            docker logs --since 10m shgps-traccar-1 2>&1 | tail -300

            echo ""
            echo "=== 8. Traccar log file (last 200 lines) ==="
            docker exec shgps-traccar-1 tail -200 /opt/traccar/logs/tracker-server.log 2>&1 || echo "no log file"

            echo ""
            echo "=== 9. PostgreSQL active connections ==="
            docker exec shgps-postgres-1 psql -U shgps -d shgps -c "SELECT count(*), state, wait_event_type, wait_event, substring(query,1,80) as query FROM pg_stat_activity GROUP BY state, wait_event_type, wait_event, substring(query,1,80) ORDER BY count DESC LIMIT 20" 2>&1

            echo ""
            echo "=== 10. PostgreSQL database sizes ==="
            docker exec shgps-postgres-1 psql -U shgps -d shgps -c "SELECT datname, pg_size_pretty(pg_database_size(datname)) as size FROM pg_database WHERE datname='shgps'" 2>&1

            echo ""
            echo "=== 11. OOM kill check (dmesg) ==="
            dmesg 2>/dev/null | grep -i "out of memory|oom|killed process" | tail -10 || echo "dmesg not available"

            echo ""
            echo "=== 12. Short packet capture on 5023 (20s) ==="
            echo "CAPTURE_START $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            timeout 20 tcpdump -i any -n -nn port 5023 -c 50 2>&1 || echo "tcpdump done"
            echo "CAPTURE_END $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            echo ""
            echo "=== DIAG END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
