name: Verify Telemetry (Temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated telemetry verification via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            echo "=== VERIFY START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            # Write the verification script to the host
            cat > /tmp/verify_telemetry.js << 'SCRIPT_EOF'
            const jwt = require("jsonwebtoken");
            const fs = require("fs");

            const TRACCAR_URL = process.env.TRACCAR_URL || "http://traccar:8082";
            const TRACCAR_EMAIL = process.env.TRACCAR_ADMIN_EMAIL;
            const TRACCAR_PASS = process.env.TRACCAR_ADMIN_PASSWORD;
            const JWT_SECRET = process.env.JWT_SECRET;
            const BACKEND_URL = "http://localhost:3001";

            async function fetchJSON(url, opts) {
              const res = await fetch(url, opts);
              const text = await res.text();
              return { status: res.status, headers: res.headers, body: text };
            }

            async function main() {
              console.log("=== 1. Traccar API: Get session ===");
              const sessionRes = await fetchJSON(TRACCAR_URL + "/api/session", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "email=" + encodeURIComponent(TRACCAR_EMAIL) + "&password=" + encodeURIComponent(TRACCAR_PASS),
              });
              console.log("Session HTTP:", sessionRes.status);
              const setCookie = sessionRes.headers.get("set-cookie") || "";
              const cookie = setCookie.split(";")[0];
              console.log("Cookie:", cookie ? cookie.substring(0, 30) + "..." : "NONE");

              console.log("");
              console.log("=== 2. Traccar API: Devices (37, 70) ===");
              const devRes = await fetchJSON(TRACCAR_URL + "/api/devices", {
                headers: { Cookie: cookie },
              });
              let traccarDevices = [];
              try { traccarDevices = JSON.parse(devRes.body); console.log("Total Traccar devices:", traccarDevices.length); } catch(e) { console.log("PARSE ERROR:", e.message); }
              [37, 70].forEach(id => {
                const d = traccarDevices.find(x => x.id === id);
                if (!d) { console.log("DEVICE " + id + ": NOT FOUND"); return; }
                console.log("DEVICE " + id + ":", JSON.stringify({ id: d.id, name: d.name, uniqueId: d.uniqueId, status: d.status, lastUpdate: d.lastUpdate, positionId: d.positionId }));
              });

              console.log("");
              console.log("=== 3. Traccar API: Positions (37, 70) ===");
              const posRes = await fetchJSON(TRACCAR_URL + "/api/positions", {
                headers: { Cookie: cookie },
              });
              let traccarPositions = [];
              try { traccarPositions = JSON.parse(posRes.body); console.log("Total Traccar positions:", traccarPositions.length); } catch(e) { console.log("PARSE ERROR:", e.message); }
              [37, 70].forEach(id => {
                const p = traccarPositions.find(x => x.deviceId === id);
                if (!p) { console.log("POSITION " + id + ": NOT FOUND"); return; }
                console.log("POSITION " + id + ":", JSON.stringify({
                  id: p.id, deviceId: p.deviceId,
                  fixTime: p.fixTime, serverTime: p.serverTime, deviceTime: p.deviceTime,
                  latitude: p.latitude, longitude: p.longitude,
                  speed: p.speed, altitude: p.altitude,
                  accuracy: p.accuracy, satellites: p.satellites,
                  attributes: {
                    ignition: p.attributes?.ignition,
                    motion: p.attributes?.motion,
                    charge: p.attributes?.charge,
                    battery: p.attributes?.battery,
                    batteryLevel: p.attributes?.batteryLevel,
                    power: p.attributes?.power,
                    rssi: p.attributes?.rssi,
                    odometer: p.attributes?.odometer,
                    distance: p.attributes?.distance,
                    totalDistance: p.attributes?.totalDistance,
                  }
                }));
              });

              console.log("");
              console.log("=== 4. Backend REST: Create JWT ===");
              const token = jwt.sign({ userId: "16" }, JWT_SECRET, { expiresIn: "1h" });
              console.log("JWT created, length:", token.length);

              console.log("");
              console.log("=== 5. Backend REST: /api/devices (37, 70) ===");
              const apiRes = await fetchJSON(BACKEND_URL + "/api/devices", {
                headers: { Authorization: "Bearer " + token },
              });
              console.log("Backend /api/devices HTTP:", apiRes.status);
              let backendDevices = [];
              try {
                const parsed = JSON.parse(apiRes.body);
                backendDevices = Array.isArray(parsed) ? parsed : (parsed.devices || parsed.data || []);
                console.log("Total backend devices:", backendDevices.length);
              } catch(e) { console.log("PARSE ERROR:", e.message); console.log("RAW (first 300):", apiRes.body.substring(0, 300)); }
              [37, 70].forEach(id => {
                const d = backendDevices.find(v => v.traccar_id === id || v.traccarId === id);
                if (!d) { console.log("BACKEND DEVICE traccar_id=" + id + ": NOT FOUND"); return; }
                console.log("BACKEND DEVICE traccar_id=" + id + ":", JSON.stringify({
                  id: d.id, name: d.name, imei: d.imei,
                  status: d.status, online: d.online,
                  lastUpdate: d.lastUpdate, fixTime: d.fixTime,
                  lat: d.lat, lng: d.lng, speed: d.speed,
                  voltage: d.voltage, batteryLevel: d.batteryLevel,
                  signal: d.signal, charge: d.charge,
                  ignition: d.ignition, motion: d.motion,
                  satellites: d.satellites,
                  distance: d.distance, odometer: d.odometer,
                  powerDisconnected: d.powerDisconnected,
                  trackingEnabled: d.trackingEnabled
                }));
              });

              console.log("");
              console.log("=== 6. Backend health ===");
              const healthRes = await fetchJSON(BACKEND_URL + "/api/health");
              console.log(healthRes.body);
            }

            main().catch(e => console.error("FATAL:", e.message));
            SCRIPT_EOF

            # Copy script to backend container and run it
            docker cp /tmp/verify_telemetry.js shgps-backend-1:/tmp/verify_telemetry.js
            docker exec shgps-backend-1 node /tmp/verify_telemetry.js

            echo ""
            echo "=== VERIFY END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
