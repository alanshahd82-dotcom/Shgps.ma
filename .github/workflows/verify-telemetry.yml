name: Verify Telemetry (Temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated telemetry verification via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            echo "=== VERIFY START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            ENV_FILE=/opt/shgps/.env
            TRACCAR_EMAIL=$(grep -E '^TRACCAR_ADMIN_EMAIL=' "$ENV_FILE" | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d ' ')
            TRACCAR_PASS=$(grep -E '^TRACCAR_ADMIN_PASSWORD=' "$ENV_FILE" | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d ' ')
            JWT_SECRET=$(grep -E '^JWT_SECRET=' "$ENV_FILE" | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d ' ')
            echo "Traccar email found: $(test -n "$TRACCAR_EMAIL" && echo YES || echo NO)"
            echo "Traccar pass found: $(test -n "$TRACCAR_PASS" && echo YES || echo NO)"
            echo "JWT secret found: $(test -n "$JWT_SECRET" && echo YES || echo NO)"

            echo ""
            echo "=== 1. Traccar API: Get session ==="
            SESSION_RESP=$(docker exec shgps-backend-1 curl -s -w "\nHTTP_CODE:%{http_code}" -c /tmp/cookie.jar -X POST "http://traccar:8082/api/session" -H "Content-Type: application/x-www-form-urlencoded" -d "email=${TRACCAR_EMAIL}&password=${TRACCAR_PASS}")
            echo "Session response: $SESSION_RESP"

            echo ""
            echo "=== 2. Traccar API: Devices (37, 70) ==="
            docker exec shgps-backend-1 curl -s -b /tmp/cookie.jar "http://traccar:8082/api/devices" > /tmp/traccar_devices.json
            echo "File size: $(wc -c < /tmp/traccar_devices.json) bytes"
            node -e 'const fs=require("fs");const raw=fs.readFileSync("/tmp/traccar_devices.json","utf8");try{const d=JSON.parse(raw);console.log("Total Traccar devices: "+d.length);[37,70].forEach(id=>{const x=d.find(v=>v.id===id);if(!x){console.log("DEVICE "+id+": NOT FOUND");return;}console.log("DEVICE "+id+": "+JSON.stringify({id:x.id,name:x.name,uniqueId:x.uniqueId,status:x.status,lastUpdate:x.lastUpdate,positionId:x.positionId}));});}catch(e){console.log("PARSE ERROR: "+e.message);console.log("RAW (first 300): "+raw.substring(0,300));}'

            echo ""
            echo "=== 3. Traccar API: Positions (37, 70) ==="
            docker exec shgps-backend-1 curl -s -b /tmp/cookie.jar "http://traccar:8082/api/positions" > /tmp/traccar_positions.json
            echo "File size: $(wc -c < /tmp/traccar_positions.json) bytes"
            node -e 'const fs=require("fs");const raw=fs.readFileSync("/tmp/traccar_positions.json","utf8");try{const d=JSON.parse(raw);console.log("Total Traccar positions: "+d.length);[37,70].forEach(id=>{const p=d.find(v=>v.deviceId===id);if(!p){console.log("POSITION "+id+": NOT FOUND");return;}console.log("POSITION "+id+": "+JSON.stringify({id:p.id,deviceId:p.deviceId,fixTime:p.fixTime,serverTime:p.serverTime,deviceTime:p.deviceTime,latitude:p.latitude,longitude:p.longitude,speed:p.speed,altitude:p.altitude,accuracy:p.accuracy,satellites:p.satellites,attributes:{ignition:p.attributes&&p.attributes.ignition,motion:p.attributes&&p.attributes.motion,charge:p.attributes&&p.attributes.charge,battery:p.attributes&&p.attributes.battery,batteryLevel:p.attributes&&p.attributes.batteryLevel,power:p.attributes&&p.attributes.power,rssi:p.attributes&&p.attributes.rssi,odometer:p.attributes&&p.attributes.odometer,distance:p.attributes&&p.attributes.distance,totalDistance:p.attributes&&p.attributes.totalDistance}}));});}catch(e){console.log("PARSE ERROR: "+e.message);console.log("RAW (first 300): "+raw.substring(0,300));}'

            echo ""
            echo "=== 4. Backend REST: Get admin user from DB ==="
            ADMIN_USER=$(docker exec shgps-postgres-1 psql -U shgps -d shgps -t -c "SELECT id, email FROM users WHERE is_admin = true AND is_active = true LIMIT 1" 2>/dev/null | tr -d ' ' | head -1)
            echo "Admin user: $ADMIN_USER"
            USER_ID=$(echo "$ADMIN_USER" | cut -d'|' -f1)
            USER_EMAIL=$(echo "$ADMIN_USER" | cut -d'|' -f2)
            echo "User ID: $USER_ID, Email: $USER_EMAIL"

            echo ""
            echo "=== 5. Backend REST: Create JWT token ==="
            JWT_TOKEN=$(docker exec shgps-backend-1 node -e "const jwt=require('jsonwebtoken');const t=jwt.sign({userId:'$USER_ID'},'$JWT_SECRET',{expiresIn:'1h'});console.log(t);")
            echo "JWT length: $(echo -n "$JWT_TOKEN" | wc -c)"

            echo ""
            echo "=== 6. Backend REST: /api/devices (37, 70) ==="
            docker exec shgps-backend-1 curl -s "http://localhost:3001/api/devices" -H "Authorization: Bearer $JWT_TOKEN" > /tmp/backend_devices.json
            echo "File size: $(wc -c < /tmp/backend_devices.json) bytes"
            node -e 'const fs=require("fs");const raw=fs.readFileSync("/tmp/backend_devices.json","utf8");try{const data=JSON.parse(raw);const arr=Array.isArray(data)?data:(data.devices||data.data||[]);console.log("Total backend devices: "+arr.length);[37,70].forEach(id=>{const d=arr.find(v=>v.traccar_id===id||v.traccarId===id);if(!d){console.log("BACKEND DEVICE traccar_id="+id+": NOT FOUND");return;}console.log("BACKEND DEVICE traccar_id="+id+": "+JSON.stringify({id:d.id,name:d.name,imei:d.imei,status:d.status,online:d.online,lastUpdate:d.lastUpdate,fixTime:d.fixTime,lat:d.lat,lng:d.lng,speed:d.speed,voltage:d.voltage,batteryLevel:d.batteryLevel,signal:d.signal,charge:d.charge,ignition:d.ignition,motion:d.motion,satellites:d.satellites,distance:d.distance,odometer:d.odometer,powerDisconnected:d.powerDisconnected,trackingEnabled:d.trackingEnabled}));});}catch(e){console.log("PARSE ERROR: "+e.message);console.log("RAW (first 300): "+raw.substring(0,300));}'

            echo ""
            echo "=== 7. Backend health ==="
            docker exec shgps-backend-1 curl -s "http://localhost:3001/api/health"

            echo ""
            echo "=== VERIFY END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
