name: Verify Telemetry (Temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated telemetry verification via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            echo "=== VERIFY START $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            echo "" | base64 -d > /tmp/verify_telemetry.js
            echo "Script written: $(wc -c < /tmp/verify_telemetry.js) bytes"

            docker cp /tmp/verify_telemetry.js shgps-backend-1:/tmp/verify_telemetry.js
            docker exec shgps-backend-1 node /tmp/verify_telemetry.js 2>&1

            echo ""
            echo "=== VERIFY END $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
