name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_ENV: development

      # ── 4. Build web assets ───────────────────────────────────────────────────
      - name: Build Vite app
        run: npx vite build

      # ── 5. Add Android platform (generates android/ folder) ──────────────────
      - name: Add Capacitor Android platform
        run: npx cap add android

      # ── 6. Copy app icon to all mipmap densities ──────────────────────────────
      - name: Copy app icon (logo.jpeg → mipmap-*)
        run: |
          sudo apt-get install -y imagemagick

          ICON_SRC="public/logo.jpeg"
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DIR in "${!SIZES[@]}"; do
            SIZE="${SIZES[$DIR]}"
            DEST="android/app/src/main/res/${DIR}/ic_launcher.png"
            mkdir -p "android/app/src/main/res/${DIR}"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "$DEST"
            echo "✔ Created $DEST (${SIZE}x${SIZE})"

            # Round icon variant
            DEST_ROUND="android/app/src/main/res/${DIR}/ic_launcher_round.png"
            convert "$ICON_SRC" \
              -resize "${SIZE}x${SIZE}" \
              \( +clone  -alpha extract \
                 -draw "fill black polygon 0,0 0,${SIZE} ${SIZE},${SIZE} ${SIZE},0
                        fill white circle $(( SIZE/2 )),$(( SIZE/2 )) $(( SIZE/2 )),0" \
                 \( +clone -negate \) \
                 -compose multiply -composite \
              \) \
              -alpha off -compose copyopacity -composite \
              "$DEST_ROUND"
            echo "✔ Created $DEST_ROUND (round, ${SIZE}x${SIZE})"
          done

      # ── 7. Sync Capacitor ─────────────────────────────────────────────────────
      - name: Capacitor sync (web → android)
        run: npx cap sync android

      # ── 8. Java 17 ────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 9. Android SDK ────────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 10. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 12. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHGPS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 13. Show APK size ────────────────────────────────────────────────────
      - name: Report APK info
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK built successfully — size: $SIZE"
            echo "📦 Download from the Actions tab → this run → Artifacts section"
          else
            echo "❌ APK not found"
            exit 1
          fi
