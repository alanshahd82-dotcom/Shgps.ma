name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install Capacitor CLI + Android plugin only ────────────────────────
      #   dist/ is already committed in the repo, so we skip the full npm install
      #   and only install what we need to run `cap add android` and `cap sync`.
      - name: Install Capacitor dependencies
        run: |
          npm install --save-dev @capacitor/cli@^6.2.0
          npm install @capacitor/core@^6.2.0 \
                      @capacitor/android@^6.2.0 \
                      @capacitor/splash-screen@^6.0.2 \
                      @capacitor/status-bar@^6.0.2

      # ── 4. Verify dist/ is present ────────────────────────────────────────────
      - name: Verify dist/ folder
        run: |
          ls dist/
          echo "✔ dist/ folder present — skipping Vite build"

      # ── 5. Add Android platform ───────────────────────────────────────────────
      - name: Add Capacitor Android platform
        run: ./node_modules/.bin/cap add android

      # ── 6. Copy app icon to all mipmap densities ──────────────────────────────
      - name: Copy app icon (logo.jpeg → mipmap-*)
        run: |
          sudo apt-get install -y imagemagick

          ICON_SRC="public/logo.jpeg"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DIR in "${!SIZES[@]}"; do
            SIZE="${SIZES[$DIR]}"
            DEST_DIR="android/app/src/main/res/${DIR}"
            mkdir -p "$DEST_DIR"

            # Standard launcher icon
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "${DEST_DIR}/ic_launcher.png"
            echo "✔ ${DEST_DIR}/ic_launcher.png (${SIZE}x${SIZE})"

            # Round icon — white circle mask
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              -gravity center \
              -background none \
              \( +clone -alpha extract \
                 -draw "fill white circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
              \) \
              -compose CopyOpacity -composite \
              "${DEST_DIR}/ic_launcher_round.png"
            echo "✔ ${DEST_DIR}/ic_launcher_round.png (round, ${SIZE}x${SIZE})"

            # foreground layer for adaptive icons
            cp "${DEST_DIR}/ic_launcher.png" "${DEST_DIR}/ic_launcher_foreground.png"
          done

      # ── 7. Sync Capacitor (copies dist/ into android/app/src/main/assets/) ───
      - name: Capacitor sync
        run: ./node_modules/.bin/cap sync android

      # ── 8. Java 17 ────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 9. Android SDK ────────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 10. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 12. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHGPS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 13. Report ────────────────────────────────────────────────────────────
      - name: APK info
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK built successfully — size: $SIZE"
          else
            echo "❌ APK not found"
            exit 1
          fi
