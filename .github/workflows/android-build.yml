name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run_signing:
        description: 'Prove the signed-release pipeline with a throwaway key (result is NOT for the store)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Play Store requires the newest target API level: change it here when Google raises it.
      ANDROID_TARGET_SDK: '35'
      # Signing secrets (see docs/PLAY_STORE_RELEASE.md). Without them only the debug APK is built.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 20 ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Force npm registry to public npmjs.org ────────────────────────────
      - name: Set npm registry to public npmjs.org
        run: npm config set registry https://registry.npmjs.org/

      # ── 4. Install all dependencies (frontend + Capacitor) ───────────────────
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install
          echo "✔ All dependencies installed"
          ls node_modules/.bin/cap || (echo "❌ cap not found" && exit 1)

      # ── 5. Build frontend from source ────────────────────────────────────────
      #   Always rebuild from src/ so any code change appears in the APK.
      - name: Build Vite app
        run: |
          npm run build
          echo "✔ Vite build complete"
          ls -lh dist/

      # ── 6. Convert capacitor.config.ts → capacitor.config.json ───────────────
      - name: Convert capacitor config to JSON
        run: |
          node -e "
          const fs = require('fs');
          const config = {
            appId: 'com.athargps.app',
            appName: 'ATHAR GPS',
            webDir: 'dist',
            server: { androidScheme: 'https' },
            plugins: {
              SplashScreen: {
                launchShowDuration: 2000,
                backgroundColor: '#0F2044',
                showSpinner: false,
                splashFullScreen: true,
                splashImmersive: true
              },
              StatusBar: {
                style: 'Dark',
                backgroundColor: '#0F2044'
              }
            }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          if (fs.existsSync('capacitor.config.ts')) fs.unlinkSync('capacitor.config.ts');
          console.log('✔ capacitor.config.json written');
          "

      # ── 7. Add Capacitor Android platform ────────────────────────────────────
      - name: Add Capacitor Android platform
        run: ./node_modules/.bin/cap add android

      # ── 7b. Location permission so the app can show the user's own position ──
      - name: Add location permissions to the Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$MANIFEST"
          grep -n "location" "$MANIFEST"

      # ── 8. Copy app icon to all mipmap densities ─────────────────────────────
      - name: Copy app icon
        run: |
          # Refresh the package index first: on a fresh runner the cached index points at
          # files the mirror no longer has (404 on ghostscript), which failed every build.
          sudo apt-get update -q
          sudo apt-get install -y imagemagick -q --fix-missing

          ICON_SRC="public/icon.png"
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DIR in "${!SIZES[@]}"; do
            SIZE="${SIZES[$DIR]}"
            DEST_DIR="android/app/src/main/res/${DIR}"
            mkdir -p "$DEST_DIR"

            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "${DEST_DIR}/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              -gravity center -background none \
              \( +clone -alpha extract \
                 -draw "fill white circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \) \
              -compose CopyOpacity -composite \
              "${DEST_DIR}/ic_launcher_round.png"
            cp "${DEST_DIR}/ic_launcher.png" "${DEST_DIR}/ic_launcher_foreground.png"
            echo "✔ ${DIR} — ${SIZE}x${SIZE}"
          done

      # ── 9. Sync Capacitor ─────────────────────────────────────────────────────
      - name: Capacitor sync
        run: ./node_modules/.bin/cap sync android

      # ── 10. Java 17 ───────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 11. Android SDK ──────────────────────────────────────────────────────
      # The runner image already ships the Android SDK. The old setup-android action now
      # crashes ("Failed to find package 'tools'"), so it is replaced by a license accept.
      - name: Accept Android SDK licenses (SDK is preinstalled)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          ls "$SDK/platforms" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ── 12. Make gradlew executable ──────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 12b. Version + API levels (Play Store needs a rising versionCode and a current target SDK) ──
      - name: Set version and SDK levels
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          T="$ANDROID_TARGET_SDK"
          [ -d "$SDK/platforms/android-$T" ] || "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$T" || true
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          sed -i -E "s/(targetSdkVersion *= *)[0-9]+/\1$T/; s/(compileSdkVersion *= *)[0-9]+/\1$T/" android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=$T" >> android/gradle.properties
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE targetSdk=$T"
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle
          grep -n "SdkVersion" android/variables.gradle

      # ── 13. Build debug APK ──────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 14. Upload APK ───────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATHAR-GPS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 15. Report ───────────────────────────────────────────────────────────
      - name: APK info
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK built — size: $(du -sh "$APK" | cut -f1)"
          else
            echo "❌ APK not found"; exit 1
          fi

      # ── 16. Signed release (Play Store) ──────────────────────────────────────────────────
      # Real signing needs the 4 secrets in docs/PLAY_STORE_RELEASE.md. A manual run with
      # "dry_run_signing" uses a throwaway key to prove the pipeline (artifacts are named DRYRUN).
      - name: Prepare signing key
        id: sign
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGN=true"
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "ARTIFACT_SUFFIX="
            } >> "$GITHUB_ENV"
          elif [ "${{ inputs.dry_run_signing }}" = "true" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -alias dryrun -keyalg RSA -keysize 2048 -validity 30 \
              -storepass dryrunpass -keypass dryrunpass -dname "CN=DRY RUN, O=not for the store" > /dev/null
            {
              echo "SIGN=true"
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PASSWORD=dryrunpass"
              echo "KEY_ALIAS=dryrun"
              echo "KEY_PASSWORD=dryrunpass"
              echo "ARTIFACT_SUFFIX=-DRYRUN-NOT-FOR-STORE"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets: only the debug APK was built."
          fi

      - name: Configure release signing
        if: env.SIGN == 'true'
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build signed release (AAB for Play + APK)
        if: env.SIGN == 'true'
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify the signature
        if: env.SIGN == 'true'
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | head -8
          ls -lh android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed AAB (upload this file to Play Console)
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ATHAR-GPS-release-aab${{ env.ARTIFACT_SUFFIX }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload signed release APK
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ATHAR-GPS-release-apk${{ env.ARTIFACT_SUFFIX }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
