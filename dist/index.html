    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
      html, body { height: 100%; width: 100%; background: #0a1628; }

      /* ── شاشة البداية ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: linear-gradient(170deg, #071629 0%, #0F2044 55%, #0d2850 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

      /* شبكة الخلفية */
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
           linear-gradient(rgba(228,181,107,0.04) 1px, transparent 1px),
           linear-gradient(90deg, rgba(228,181,107,0.04) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* دوائر الرادار */
      .splash-radar {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .splash-ring {
        position: absolute;
        border-radius: 50%;
         border: 1px solid rgba(228,181,107,0.15);
        transform: translate(-50%, -50%);
        animation: radar-pulse 3s ease-in-out infinite;
      }
      .splash-ring:nth-child(1) { width: 440px; height: 440px; animation-delay: 0s; }
      .splash-ring:nth-child(2) { width: 320px; height: 320px; animation-delay: 0.8s; }
      .splash-ring:nth-child(3) { width: 200px; height: 200px; animation-delay: 1.6s; }
      .splash-dot {
        position: absolute;
        width: 10px; height: 10px;
         background: #e4b56b;
        border-radius: 50%;
        transform: translate(-50%, -50%);
         box-shadow: 0 0 12px #e4b56b, 0 0 24px rgba(228,181,107,0.5);
        animation: dot-pulse 2.5s ease-in-out infinite;
      }

      @keyframes radar-pulse {
        0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(1); }
        50%       { opacity: 0.4;  transform: translate(-50%, -50%) scale(1.04); }
      }
      @keyframes dot-pulse {
         0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; box-shadow: 0 0 12px #e4b56b, 0 0 24px rgba(228,181,107,0.5); }
         50%       { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; box-shadow: 0 0 20px #e4b56b, 0 0 40px rgba(228,181,107,0.4); }
      }

      /* المحتوى المركزي */
      .splash-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-top: 40px;
      }

      /* الأيقونة */
      .splash-icon {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(0,217,126,0.3), 0 0 32px rgba(0,217,126,0.2), 0 8px 32px rgba(0,0,0,0.5);
        animation: icon-appear 0.6s ease-out 0.2s both;
      }
      .splash-icon img { width: 100%; height: 100%; -o-object-fit: cover; object-fit: cover; }
      .athar-mark {
        width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        color: #17324d; background: #e4b56b; font: 900 42px Cairo, sans-serif; letter-spacing: -.08em;
      }

      @keyframes icon-appear {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* اسم التطبيق */
      .splash-name {
        animation: name-appear 0.6s ease-out 0.45s both;
        text-align: center;
      }
      .splash-name .big {
        font-size: 38px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -1px;
        line-height: 1;
        direction: ltr;
      }
      .splash-name .big span { color: #e4b56b; }
      .splash-name .sub {
        font-size: 11px;
        font-weight: 600;
        color: rgba(0,217,126,0.5);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-top: 6px;
        direction: ltr;
      }

      @keyframes name-appear {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* شريط التحميل */
      .splash-loader {
        width: 120px;
        height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 8px;
        animation: loader-appear 0.4s ease-out 0.7s both;
      }
      .splash-loader-bar {
        height: 100%;
         background: linear-gradient(90deg, #e4b56b, #c8843c);
        border-radius: 99px;
        animation: loading 1.8s ease-in-out 0.7s both;
      }

      @keyframes loader-appear {
        from { opacity: 0; } to { opacity: 1; }
      }
      @keyframes loading {
        0%   { width: 0%; }
        60%  { width: 85%; }
        100% { width: 100%; }
      }

      /* حقوق */
      .splash-footer {
        position: absolute;
        bottom: max(32px, env(safe-area-inset-bottom, 20px));
        font-size: 11px;
        color: rgba(255,255,255,0.15);
        letter-spacing: 0.05em;
        animation: name-appear 0.4s ease-out 0.8s both;
      }
    </style>

    <link rel="stylesheet" crossorigin href="/assets/index-BXIPSwc0.css">

  <body>
    <!-- ── شاشة البداية ── -->
    <div id="splash">
      <div class="splash-radar">
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-dot"></div>
      </div>

      <div class="splash-content">
        <div class="splash-icon">
        <img class="athar-mark" src="/athar-gps-mark.svg" alt="ATHAR GPS" />
        </div>
        <div class="splash-name">
          <div class="big">ATHAR <span>GPS</span></div>
          <div class="sub">Fleet intelligence platform</div>
        </div>
        <div class="splash-loader">
          <div class="splash-loader-bar"></div>
        </div>
      </div>

      <div class="splash-footer">© 2025 ATHAR GPS · Fleet intelligence</div>
    </div>

    <!-- ── التطبيق ── -->
    <div id="root"></div>


    <script>
      // إخفاء شاشة البداية عند تحميل التطبيق
      window.__hideSplash = function () {
        var splash = document.getElementById('splash')
        if (splash) {
          splash.classList.add('hidden')
          setTimeout(function () { splash.remove() }, 600)
        }
      }
      // إخفاء تلقائي بعد 3 ثوانٍ كأمان أقصى
      setTimeout(window.__hideSplash, 3000)

      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
