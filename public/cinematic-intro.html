<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ATHAR GPS Cinematic Intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050b18}
.stage{position:relative;width:390px;height:844px;overflow:hidden;background:radial-gradient(120% 70% at 50% 110%,#0F2044 0%,#07111f 55%,#030812 100%);font-family:'IBM Plex Sans Arabic',sans-serif;color:#fff}
.layer{position:absolute;inset:0}
.stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe3ff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

/* ---------- SCENE 1: orbit ---------- */
.s1{animation:s1 10s ease-in-out infinite}
@keyframes s1{0%{opacity:0;transform:scale(1.1)}6%{opacity:1}22%{opacity:1;transform:scale(1)}29%{opacity:0;transform:scale(2.4)}100%{opacity:0;transform:scale(2.4)}}
.earth{position:absolute;left:-205px;bottom:-560px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle at 50% 20%,#123a7a 0%,#0a1f45 40%,#040b1a 70%);box-shadow:0 -6px 40px rgba(0,217,126,.45),inset 0 18px 50px rgba(0,217,126,.35)}
.earth-grid{position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(0,217,126,.12) 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,rgba(0,217,126,.10) 0 1px,transparent 1px 40px);animation:spinE 30s linear infinite;-webkit-mask:radial-gradient(circle,#000 60%,transparent 71%);mask:radial-gradient(circle,#000 60%,transparent 71%)}
@keyframes spinE{to{background-position:400px 0,0 0}}
.orbit{position:absolute;left:50%;top:430px;width:560px;height:160px;margin-left:-280px;border:1px dashed rgba(143,190,255,.25);border-radius:50%;transform:rotate(-12deg)}
.sat{position:absolute;left:50%;top:430px;width:0;height:0;animation:satMove 10s linear infinite}
@keyframes satMove{0%{transform:translate(-240px,40px)}25%{transform:translate(150px,-70px)}100%{transform:translate(150px,-70px)}}
.beam{position:absolute;left:0;top:0;width:180px;height:360px;margin-left:-90px;background:linear-gradient(180deg,rgba(0,217,126,.55),rgba(0,217,126,0));clip-path:polygon(50% 0,100% 100%,0 100%);animation:beam 1.2s ease-in-out infinite;transform-origin:50% 0}
@keyframes beam{0%,100%{opacity:.25}50%{opacity:.7}}
.s1-text{position:absolute;top:120px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:#8fbeff;direction:ltr}
.type{display:inline-block;overflow:hidden;white-space:nowrap;border-left:2px solid #00D97E;animation:type 10s steps(26) infinite;width:0}
@keyframes type{0%,3%{width:0}16%,100%{width:26ch}}

/* ---------- SCENE 2: map ---------- */
.s2{animation:s2 10s ease-in-out infinite;transform-origin:60% 55%}
@keyframes s2{0%,22%{opacity:0;transform:scale(2.6);filter:blur(8px)}30%{opacity:1;transform:scale(1.15);filter:blur(0)}60%{opacity:1;transform:scale(1)}68%{opacity:0;transform:scale(.9);filter:blur(4px)}100%{opacity:0}}
.route{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 10s ease-in-out infinite}
@keyframes draw{0%,30%{stroke-dashoffset:900}56%,100%{stroke-dashoffset:0}}
.car{position:absolute;left:0;top:0;width:34px;height:34px;offset-path:path('M 60 700 L 60 560 Q 60 520 100 520 L 220 520 Q 260 520 260 480 L 260 360 Q 260 320 300 320 L 330 320 L 330 210');offset-rotate:auto;animation:drive 10s ease-in-out infinite}
@keyframes drive{0%,30%{offset-distance:0%}56%,100%{offset-distance:100%}}
.car-dot{position:absolute;inset:7px;border-radius:50%;background:#00D97E;box-shadow:0 0 0 4px rgba(0,217,126,.25),0 0 22px #00D97E}
.car-arrow{position:absolute;right:-2px;top:12px;width:0;height:0;border-left:9px solid #00D97E;border-top:5px solid transparent;border-bottom:5px solid transparent}
.fence{position:absolute;left:280px;top:160px;width:100px;height:100px;border-radius:50%;border:1.5px dashed #00D97E;background:rgba(0,217,126,.08);animation:fence 10s ease-in-out infinite}
@keyframes fence{0%,50%{transform:scale(0);opacity:0}56%{transform:scale(1.15);opacity:1}60%,100%{transform:scale(1);opacity:1}}
.ping{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;border:2px solid #8fbeff;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(4);opacity:0}}
.hud-card{position:absolute;right:18px;bottom:120px;width:190px;padding:12px 14px;border-radius:14px;background:rgba(7,17,31,.72);border:1px solid rgba(143,190,255,.25);backdrop-filter:blur(8px);animation:hud 10s ease-in-out infinite}
@keyframes hud{0%,36%{opacity:0;transform:translateY(20px)}42%,60%{opacity:1;transform:translateY(0)}66%,100%{opacity:0}}
.alert{position:absolute;left:18px;top:110px;padding:8px 12px;border-radius:10px;background:rgba(255,149,0,.14);border:1px solid rgba(255,149,0,.5);color:#FFB547;font-size:12px;font-weight:600;animation:alert 10s ease-in-out infinite}
@keyframes alert{0%,52%{opacity:0;transform:translateX(-20px)}56%,62%{opacity:1;transform:translateX(0)}66%,100%{opacity:0}}

/* ---------- SCENE 3: logo reveal ---------- */
.s3{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;animation:s3 10s ease-in-out infinite}
@keyframes s3{0%,64%{opacity:0}70%,95%{opacity:1}100%{opacity:0}}
.mark{position:relative;width:132px;height:132px;animation:pin 10s cubic-bezier(.2,1.4,.4,1) infinite}
@keyframes pin{0%,66%{transform:translateY(-160px) scale(.6);opacity:0}74%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(0)}}
.ring{position:absolute;left:50%;top:104px;width:120px;height:36px;margin-left:-60px;border-radius:50%;border:2px solid #00D97E;animation:ring 10s ease-out infinite}
@keyframes ring{0%,73%{transform:scale(0);opacity:0}74%{transform:scale(.3);opacity:1}86%,100%{transform:scale(2.6);opacity:0}}
.halo{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(0,217,126,.35),transparent 65%);animation:tw 2.4s ease-in-out infinite}
.brand{margin-top:26px;position:relative;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:46px;letter-spacing:8px;direction:ltr;overflow:hidden;padding:0 6px}
.brand b{color:#00D97E;font-weight:700}
.brand-in{display:block;animation:rise 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes rise{0%,72%{transform:translateY(100%);opacity:0}80%,100%{transform:translateY(0);opacity:1}}
.sweep{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:sweep 10s ease-in-out infinite}
@keyframes sweep{0%,80%{left:-80px}88%,100%{left:120%}}
.tag{margin-top:10px;font-size:16px;font-weight:600;color:#b9cff5;animation:fadeT 10s ease infinite}
@keyframes fadeT{0%,78%{opacity:0;letter-spacing:6px}86%,100%{opacity:1;letter-spacing:0}}
.loader{margin-top:56px;width:220px;animation:fadeT2 10s ease infinite}
@keyframes fadeT2{0%,80%{opacity:0}85%,100%{opacity:1}}
.bar{height:3px;border-radius:3px;background:rgba(143,190,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563EB,#00D97E);box-shadow:0 0 12px #00D97E;animation:load 10s ease-in-out infinite}
@keyframes load{0%,80%{width:0}95%,100%{width:100%}}
.status{margin-top:10px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8fbeff;direction:ltr}

/* ---------- persistent HUD ---------- */
.hud{pointer-events:none}
.corner{position:absolute;width:22px;height:22px;border-color:rgba(0,217,126,.7);border-style:solid;border-width:0}
.scan{position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,transparent,rgba(0,217,126,.06),transparent);animation:scan 4s linear infinite}
@keyframes scan{0%{top:-120px}100%{top:844px}}
.rec{animation:tw 1s steps(2) infinite}
</style>
</helmet>

<div class="stage">

  <div class="layer stars">
    <span style="left:30px;top:60px"></span><span style="left:90px;top:140px;animation-delay:.6s"></span>
    <span style="left:160px;top:40px;animation-delay:1.2s"></span><span style="left:240px;top:110px;animation-delay:.3s"></span>
    <span style="left:330px;top:70px;animation-delay:1.8s"></span><span style="left:360px;top:200px;animation-delay:.9s"></span>
    <span style="left:50px;top:260px;animation-delay:2.1s"></span><span style="left:200px;top:230px;animation-delay:1.5s"></span>
    <span style="left:300px;top:290px;animation-delay:.4s"></span><span style="left:120px;top:330px;animation-delay:2.4s"></span>
  </div>

  <!-- SCENE 1 -->
  <div class="layer s1">
    <div class="s1-text"><span class="type">ACQUIRING SATELLITE LINK…</span></div>
    <div class="earth"><div class="earth-grid"></div></div>
    <div class="orbit"></div>
    <div class="sat">
      <div class="beam"></div>
      <svg width="64" height="30" viewBox="0 0 64 30" style="position:absolute;left:-32px;top:-15px" aria-hidden="true">
        <rect x="0" y="8" width="20" height="14" rx="2" fill="#2563EB" stroke="#8fbeff" stroke-width="1"></rect>
        <rect x="44" y="8" width="20" height="14" rx="2" fill="#2563EB" stroke="#8fbeff" stroke-width="1"></rect>
        <line x1="20" y1="15" x2="44" y2="15" stroke="#8fbeff" stroke-width="2"></line>
        <rect x="25" y="6" width="14" height="18" rx="3" fill="#dfe9ff"></rect>
        <circle cx="32" cy="15" r="3" fill="#00D97E"></circle>
      </svg>
    </div>
  </div>

  <!-- SCENE 2 -->
  <div class="layer s2">
    <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0" aria-hidden="true">
      <defs>
        <pattern id="blk" width="70" height="70" patternUnits="userSpaceOnUse">
          <rect width="70" height="70" fill="#0a1a33"></rect>
          <rect x="8" y="8" width="54" height="54" rx="6" fill="#0e2242"></rect>
        </pattern>
        <linearGradient id="rg" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#2563EB"></stop>
          <stop offset="1" stop-color="#00D97E"></stop>
        </linearGradient>
      </defs>
      <rect width="390" height="844" fill="url(#blk)"></rect>
      <path d="M -20 610 C 90 560 150 660 260 600 S 380 560 420 590" stroke="#123f7a" stroke-width="26" fill="none" opacity=".8"></path>
      <path d="M 0 420 L 390 380 M 0 250 L 390 290 M 140 0 L 190 844" stroke="#1a3560" stroke-width="10" fill="none"></path>
      <path d="M 60 700 L 60 560 Q 60 520 100 520 L 220 520 Q 260 520 260 480 L 260 360 Q 260 320 300 320 L 330 320 L 330 210" stroke="#00D97E" stroke-opacity=".12" stroke-width="14" fill="none" stroke-linecap="round"></path>
      <path class="route" d="M 60 700 L 60 560 Q 60 520 100 520 L 220 520 Q 260 520 260 480 L 260 360 Q 260 320 300 320 L 330 320 L 330 210" stroke="url(#rg)" stroke-width="4" fill="none" stroke-linecap="round"></path>
      <circle cx="60" cy="700" r="6" fill="#2563EB" stroke="#fff" stroke-width="2"></circle>
    </svg>
    <div class="ping" style="left:95px;top:300px"></div>
    <div class="ping" style="left:320px;top:620px;animation-delay:.7s"></div>
    <div class="ping" style="left:200px;top:160px;animation-delay:1.3s"></div>
    <div class="fence"></div>
    <div class="car"><div class="car-dot"></div><div class="car-arrow"></div></div>
    <div class="alert">دخول منطقة آمنة</div>
    <div class="hud-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:700">مركبة 01</span>
        <span style="font-size:11px;color:#00D97E;font-weight:600">● مباشر</span>
      </div>
      <div style="margin-top:8px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:#b9cff5;direction:ltr">
        <span>64 km/h</span><span>IGN ON</span><span>GSM ▮▮▮</span>
      </div>
    </div>
  </div>

  <!-- SCENE 3 -->
  <div class="layer s3">
    <div class="mark">
      <div class="halo"></div>
      <div class="ring"></div>
      <svg width="132" height="132" viewBox="0 0 200 200" style="position:relative" aria-hidden="true">
        <defs>
          <linearGradient id="appGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e40af"></stop>
            <stop offset="50%" stop-color="#2563EB"></stop>
            <stop offset="100%" stop-color="#00D97E"></stop>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="coloredBlur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>
        <rect width="200" height="200" rx="40" fill="url(#appGradient)" filter="url(#glow)"></rect>
        <circle cx="100" cy="70" r="25" fill="none" stroke="#fff" stroke-width="3"></circle>
        <path d="M100 45 L100 30" stroke="#fff" stroke-width="3" stroke-linecap="round"></path>
        <path d="M130 70 L142 70" stroke="#fff" stroke-width="3" stroke-linecap="round"></path>
        <path d="M70 70 L58 70" stroke="#fff" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="100" cy="70" r="12" fill="#00D97E"></circle>
        <path d="M100 100 L100 160 Q100 170 90 170 L60 170 Q50 170 50 160 L50 120 Q50 110 60 110 L140 110 Q150 110 150 120 L150 160 Q150 170 140 170 L110 170 Q100 170 100 160" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div class="brand"><span class="brand-in">ATHAR <b>GPS</b></span><span class="sweep"></span></div>
    <div class="tag">تتبّع ذكي. تحكّم كامل. في كل لحظة.</div>
    <div class="loader">
      <div class="bar"><i></i></div>
      <div class="status"><span>SYSTEM READY</span><span>v2.0</span></div>
    </div>
  </div>

  <!-- persistent HUD -->
  <div class="layer hud">
    <div class="scan"></div>
    <div class="corner" style="left:14px;top:14px;border-top-width:2px;border-left-width:2px"></div>
    <div class="corner" style="right:14px;top:14px;border-top-width:2px;border-right-width:2px"></div>
    <div class="corner" style="left:14px;bottom:14px;border-bottom-width:2px;border-left-width:2px"></div>
    <div class="corner" style="right:14px;bottom:14px;border-bottom-width:2px;border-right-width:2px"></div>
    <div style="position:absolute;left:22px;right:22px;bottom:28px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(143,190,255,.8);direction:ltr">
      <span>33.5731°N · 7.5898°W</span>
      <span><span class="rec" style="color:#00D97E">●</span> LIVE</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
