# Shared security headers — included from nginx.conf in the HTTPS server
# block AND in every location that sets its own add_header.
# nginx does NOT inherit add_header into a location that has its own
# add_header (e.g. Cache-Control), so without repeating this include the
# CSP/HSTS/X-Frame headers would be silently dropped on index.html,
# /assets/ and / — which is exactly the bug this fixes.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP: allow the frontend's ACTUAL external resources — cdnjs.cloudflare.com
# (xlsx/jspdf/jspdf-autotable export scripts), fonts.googleapis.com +
# cdn.jsdelivr.net (@fontsource) + unpkg.com (Leaflet CSS) styles,
# fonts.gstatic.com + cdn.jsdelivr.net fonts, and any https image (map tiles
# are proxied via /api/map/tiles so they count as 'self'). Tightened img-src
# from bare '*' (allowed http) to https: only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
# Dedup: strip the same headers the Express backend sets so nginx is the single
# authoritative source (avoids duplicate X-Frame-Options / X-Content-Type-Options
# / Referrer-Policy / HSTS on proxied /api responses).
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
