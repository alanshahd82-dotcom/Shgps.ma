events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # تحويل جميع طلبات HTTP إلى HTTPS
  server {
      listen 80;
      server_name athargps.com www.athargps.com;
      return 301 https://$host$request_uri;
  }

  # خادم HTTPS الرئيسي
  server {
      listen 443 ssl http2;
      server_name athargps.com www.athargps.com;

      # مسارات الشهادة المولدة
      ssl_certificate /etc/letsencrypt/live/athargps.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/athargps.com/privkey.pem;

      # إعدادات SSL آمنة وحديثة
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;
      ssl_prefer_server_ciphers on;

      # Frontend (React)
      location / {
          root /usr/share/nginx/html;
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
      }

      # Backend API
      location /api/ {
          proxy_pass http://backend:3001;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # WebSocket للـ Backend
      location /ws {
          proxy_pass http://backend:3001;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
      }

      # WebSocket لـ Traccar
      location /api/socket {
          proxy_pass http://traccar:8082;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
      }
  }
}
