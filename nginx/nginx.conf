events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log sanitized;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Use Docker's internal DNS resolver so nginx doesn't crash if
  # backend is temporarily unavailable (e.g. during startup or restart).
  # valid=10s forces re-resolution frequently so failover is quick.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── HTTP: redirect + Certbot challenge ────────────────────────────────────
  server {
    listen 80;
    server_name athargps.com www.athargps.com;

    location ~ /\.(env|git|htaccess|htpasswd|DS_Store) {
      deny all;
      return 403;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS: main server ────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name athargps.com www.athargps.com;

    ssl_certificate     /etc/letsencrypt/live/athargps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athargps.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP مفصّل لدعم Leaflet + Geoapify proxy + Framer Motion + WebSocket
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob: https://unpkg.com; connect-src 'self' ws: wss:; worker-src blob:;" always;

    # ── Block sensitive files ───────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd|DS_Store) {
      deny all;
      return 403;
    }

    # index.html — no cache
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # Static assets — long cache
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API + WebSocket
    # Using a variable for proxy_pass forces per-request DNS resolution via
    # the resolver above, so nginx starts cleanly even if backend is down.
    # WebSocket URLs contain a short-lived auth token in the query string.
    # Do not write that token to the access log.
    location = /api/socket {
      access_log off;
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /api/ {
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # React SPA
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }
  }
}
