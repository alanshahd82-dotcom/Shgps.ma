events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # متغيرات النطاق - سيتم تعديلها عند شراء النطاق
  map $host $domain_name {
      default 64.226.103.251;
  }

  # HTTP Server - للتحويل إلى HTTPS
  server {
      listen 80;
      server_name _;

      # مسار Certbot للتحقق من النطاق
      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      # مؤقتاً: اخدم عبر HTTP حتى يتم تفعيل HTTPS
      # بعد شراء النطاق، سيتم تشغيل enable-https.sh لتفعيل التحويل إلى HTTPS

      # React SPA
      location / {
          root  /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ @fallback;
      }

      location @fallback {
          root  /usr/share/nginx/html;
          rewrite ^ /index.html break;
      }

      # Backend API + WebSocket
      location /api/ {
          proxy_pass         http://backend:3001/api/;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_set_header   Upgrade           $http_upgrade;
          proxy_set_header   Connection        "upgrade";
          proxy_read_timeout 3600s;
      }
  }

  # HTTPS Server - سيتم تفعيله بعد شراء النطاق عبر سكربت enable-https.sh
  # server {
  #     listen 443 ssl http2;
  #     server_name YOUR_DOMAIN;
  #
  #     ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  #
  #     # إعدادات SSL آمنة
  #     ssl_protocols TLSv1.2 TLSv1.3;
  #     ssl_ciphers HIGH:!aNULL:!MD5;
  #     ssl_prefer_server_ciphers on;
  #
  #     # React SPA
  #     location / {
  #         root  /usr/share/nginx/html;
  #         index index.html;
  #         try_files $uri $uri/ /index.html;
  #     }
  #
  #     # Backend API
  #     location /api/ {
  #         proxy_pass         http://backend:3001/api/;
  #         proxy_http_version 1.1;
  #         proxy_set_header   Host              $host;
  #         proxy_set_header   X-Real-IP         $remote_addr;
  #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  #         proxy_set_header   X-Forwarded-Proto $scheme;
  #         proxy_set_header   Upgrade           $http_upgrade;
