worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    upstream traccar {
        server traccar:8082;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name athargps.com www.athargps.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name athargps.com www.athargps.com;

        ssl_certificate     /etc/letsencrypt/live/athargps.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/athargps.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Fleet Tracker API (/fleet/ prefix) ───────────────────────────────
        # All mobile-app API calls. Uses /fleet/ to avoid colliding with
        # Traccar's own /api/ namespace.
        location /fleet/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  5s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # ── Root redirect → Traccar admin panel ──────────────────────────────
        location = / {
            return 301 /admin;
        }

        # ── Everything else → Traccar (web UI + Traccar API) ─────────────────
        # Covers: /api/server, /api/session, /api/devices (Traccar's),
        #         /client/settings, /admin/map, and the Traccar web app root.
        location / {
            proxy_pass         http://traccar;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout  5s;
            proxy_read_timeout    60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
