events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Upstream للـ backend API
  upstream backend {
    server backend:3001;
  }

  # Upstream لواجهة Traccar الإدارية (HTTP على المنفذ 8082)
  upstream traccar {
    server traccar:8082;
  }

  server {
      listen 80;
      server_name athargps.com www.athargps.com;

      # مسار Certbot للتحقق من النطاق
      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      # index.html — لا كاش أبداً (المتصفح يجلبه دائماً من السيرفر)
      location = /index.html {
          root /usr/share/nginx/html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires "0";
      }

      # ملفات الأصول (JS/CSS) — لها هاش فريد لكل بناء؛ آمن للكاش الطويل
      location /assets/ {
          root /usr/share/nginx/html;
          add_header Cache-Control "public, max-age=31536000, immutable";
      }

      # Backend API
      location /api/ {
          proxy_pass http://backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # واجهة Traccar الإدارية — متاحة عبر /traccar/
      location /traccar/ {
          proxy_pass http://traccar/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
      }

      # React SPA — يجب أن يكون آخر location
      location / {
          root /usr/share/nginx/html;
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache, no-store, must-revalidate";
          add_header Pragma "no-cache";
          add_header Expires "0";
      }
  }
}
