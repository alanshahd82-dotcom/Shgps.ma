events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log sanitized;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Use Docker's internal DNS resolver so nginx doesn't crash if
  # backend is temporarily unavailable (e.g. during startup or restart).
  # valid=10s forces re-resolution frequently so failover is quick.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── HTTP: redirect + Certbot challenge ────────────────────────────────────
  server {
    listen 80;
    server_name athargps.com www.athargps.com;

    location ~ /\.(env|git|htaccess|htpasswd|DS_Store) {
      deny all;
      return 403;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS: main server ────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name athargps.com www.athargps.com;

    ssl_certificate     /etc/letsencrypt/live/athargps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athargps.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ────────────────────────────────────────────────────
    # Security headers live in the shared snippet so they can be included in
    # every location (nginx does NOT inherit add_header into a location that
    # sets its own add_header — e.g. Cache-Control — so without the per-location
    # include the CSP/HSTS/X-Frame headers would be silently dropped on
    # index.html, /assets/ and /).
    include /etc/nginx/security-headers.conf;

    # ── Block sensitive files ───────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd|DS_Store) {
      deny all;
      return 403;
    }

    # index.html — no cache
    location = /index.html {
      root /usr/share/nginx/html;
      # Auto-heal: a corrupted/empty CSS file cached on a device leaves the app
      # unstyled forever. Inject a tiny script that detects it, clears the caches
      # and service worker, then reloads once.
      sub_filter_once on;
      sub_filter_types text/html;
      sub_filter '</head>' '<script>(function(){var k="athargps_css_heal";function broken(){var l=document.getElementsByTagName("link"),f=0,i,h,s;for(i=0;i<l.length;i++){h=l[i].href||"";if(l[i].rel!=="stylesheet"||h.indexOf("/assets/")<0)continue;f=1;try{s=l[i].sheet;if(s&&s.cssRules&&s.cssRules.length>0)return false;}catch(e){return false;}}return f===1;}function heal(){try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1");}catch(e){}var go=function(){location.replace(location.pathname+"?fresh="+Date.now());},j=[];try{if(window.caches&&caches.keys)j.push(caches.keys().then(function(a){return Promise.all(a.map(function(c){return caches.delete(c);}));}));if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)j.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));}catch(e){}Promise.all(j).then(go,go);}window.addEventListener("load",function(){setTimeout(function(){if(broken())heal();else{try{sessionStorage.removeItem(k);}catch(e){}}},900);});}());</script></head>';
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
      include /etc/nginx/security-headers.conf;
    }

    # Static assets — long cache
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=604800";
      include /etc/nginx/security-headers.conf;
    }

    # Backend API + WebSocket
    # Using a variable for proxy_pass forces per-request DNS resolution via
    # the resolver above, so nginx starts cleanly even if backend is down.
    # WebSocket URLs contain a short-lived auth token in the query string.
    # Do not write that token to the access log.
    location = /api/socket {
      access_log off;
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /api/ {
      set $backend_upstream http://backend:3001;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # React SPA
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      # Auto-heal: a corrupted/empty CSS file cached on a device leaves the app
      # unstyled forever. Inject a tiny script that detects it, clears the caches
      # and service worker, then reloads once.
      sub_filter_once on;
      sub_filter_types text/html;
      sub_filter '</head>' '<script>(function(){var k="athargps_css_heal";function broken(){var l=document.getElementsByTagName("link"),f=0,i,h,s;for(i=0;i<l.length;i++){h=l[i].href||"";if(l[i].rel!=="stylesheet"||h.indexOf("/assets/")<0)continue;f=1;try{s=l[i].sheet;if(s&&s.cssRules&&s.cssRules.length>0)return false;}catch(e){return false;}}return f===1;}function heal(){try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1");}catch(e){}var go=function(){location.replace(location.pathname+"?fresh="+Date.now());},j=[];try{if(window.caches&&caches.keys)j.push(caches.keys().then(function(a){return Promise.all(a.map(function(c){return caches.delete(c);}));}));if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)j.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));}catch(e){}Promise.all(j).then(go,go);}window.addEventListener("load",function(){setTimeout(function(){if(broken())heal();else{try{sessionStorage.removeItem(k);}catch(e){}}},900);});}());</script></head>';
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
      include /etc/nginx/security-headers.conf;
    }
  }
}
