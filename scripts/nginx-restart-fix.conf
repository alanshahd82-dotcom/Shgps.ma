# ─────────────────────────────────────────────────────────────────────────────
# nginx upstream retry config  (#36 — Keep app reachable during server restarts)
#
# Apply by copying relevant sections into /opt/shgps/nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────

upstream backend {
    server backend:3000;

    # nginx will retry requests if the backend is down.
    # Combined with the proxy_next_upstream directives below this means
    # a brief backend restart (rolling deploy, crash-restart) becomes
    # transparent to the client.
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# ── Shared proxy settings (paste into the relevant server/location blocks) ──
#
#   proxy_connect_timeout  5s;     # give backend up to 5s to accept a new TCP connection
#   proxy_read_timeout     60s;    # wait up to 60s for a slow response
#   proxy_send_timeout     60s;
#
#   # Retry on connection-refused / gateway errors / timeouts — but never
#   # retry non-idempotent methods (POST/PUT/PATCH/DELETE) to avoid double-sends.
#   proxy_next_upstream    error timeout http_502 http_503 http_504;
#   proxy_next_upstream_tries    3;
#   proxy_next_upstream_timeout  10s;
